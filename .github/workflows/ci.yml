name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  e2e:
    name: BDD tests against the hosted Toolshop
    # Manual only: the hosted site is shared, and the demo credentials come from repository secrets.
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    env:
      AUT_BASE_URL: https://practicesoftwaretesting.com
      AUT_API_URL: https://api.practicesoftwaretesting.com
      AUT_ADMIN_EMAIL: ${{ secrets.AUT_ADMIN_EMAIL }}
      AUT_ADMIN_PASSWORD: ${{ secrets.AUT_ADMIN_PASSWORD }}
      AUT_CUSTOMER_EMAIL: ${{ secrets.AUT_CUSTOMER_EMAIL }}
      AUT_CUSTOMER_PASSWORD: ${{ secrets.AUT_CUSTOMER_PASSWORD }}
      WORKERS: 2
      EXPECT_TIMEOUT: 15000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm test
      - run: npm run report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: test-output/allure-report
