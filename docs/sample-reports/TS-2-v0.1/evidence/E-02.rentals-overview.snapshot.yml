        - paragraph [ref=e414]: Mobile hydraulic crane available for hourly rental, purpose-engineered for lifting, positioning, and placing heavy loads on active construction sites, industrial facilities, and infrastructure projects. The multi-section telescoping boom extends smoothly to reach elevated installation positions while the four-point hydraulic outrigger system provides a rock-solid, perfectly level base on uneven, sloped, or soft terrain. The precision proportional load control system allows millimeter-accurate positioning of suspended loads, while the rated capacity indicator and automatic overload cutoff ensure every lift is performed safely within the machines certified working limits. The fully enclosed operators cab features ergonomic controls, climate management, and unobstructed boom-tip visibility for confident operation in all weather conditions. Extensive safety systems including anti-two-block, swing-limit, and wind-speed monitoring protect both the operator and surrounding workers on busy sites. Perfect for structural steel erection, precast concrete placement, HVAC rooftop installation, and any material handling task that exceeds the reach or capacity of standard jobsite equipment.
