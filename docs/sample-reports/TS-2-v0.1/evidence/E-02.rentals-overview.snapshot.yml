        - heading "Excavator" [level=5] [ref=e397]
        - paragraph [ref=e398]: Heavy-duty tracked excavator available for hourly rental, designed for professional foundation digging, trenching, utility installation, and general earthmoving operations on residential and commercial construction sites. The powerful hydraulic system delivers smooth, responsive boom, arm, and bucket controls for precise positioning and efficient material handling in both tight urban spaces and open excavation sites. An enclosed climate-controlled cab provides operator comfort during long shifts, with excellent forward, side, and rear visibility through large laminated safety-glass windows and an integrated rearview camera system. The rubber-tracked undercarriage minimizes ground disturbance on finished surfaces while providing stable, sure-footed mobility on slopes, soft ground, and uneven terrain. Quick-coupling hydraulic connections allow rapid attachment changes between digging buckets, grading blades, and hydraulic breakers without leaving the cab. Suitable for projects ranging from swimming pool excavation and basement digging to municipal utility trenching and site grading operations.
